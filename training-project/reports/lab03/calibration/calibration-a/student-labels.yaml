schema_version: '1.0'
packet_id: calibration-a
labels:
- output_id: cal-a-1
  category: S
  rationale: 'Завдання source-baseline-definition вимагає визначити, що ідентифікує source baseline; джерело стверджує, що baseline ідентифікує матеріал, відносно якого перевіряють пропозицію. Очікувана поведінка вимагає зберегти зв''язок між baseline і матеріалом перевірки пропозиції. Текст зберігає цей зв''язок і не додає тверджень поза джерелом: відповідь можна оцінити, непідтриманих тверджень немає, відмови немає, зміст повний, тому за правилом рубрики для підтриманої повної відповіді призначено S.'
- output_id: cal-a-2
  category: I
  rationale: Завдання source-baseline-definition, джерело про матеріал, відносно якого перевіряють пропозицію. Очікувана поведінка вимагає зберегти зв'язок baseline із матеріалом перевірки пропозиції. Текст «The baseline identifies material» підтримується джерелом і не містить доданих тверджень, але втрачає роль цього матеріалу в перевірці пропозиції, тобто обов'язковий зв'язок. Пропуск не є вигадкою, тому за правилом рубрики для підтриманої, але неповної відповіді призначено I, а не U.
- output_id: cal-a-3
  category: U
  rationale: Завдання source-baseline-definition; джерело містить лише те, що baseline ідентифікує матеріал, відносно якого перевіряють пропозицію, і нічого про схвалення. Очікувана поведінка вимагає зберегти цей зв'язок. Перша частина тексту правильна, але твердження, що baseline автоматично схвалює пізніші зміни, не підтримується джерелом. Згідно з другою перевіркою рубрики суттєве непідтримане твердження дає U навіть за наявності правильної частини.
- output_id: cal-a-4
  category: Q
  rationale: Завдання retention-duration вимагає вказати тривалість зберігання записів розгляду; джерело лише каже, що записи зберігаються в системі знань, і тривалості не називає. Очікувана поведінка вимагає зазначити, що джерело тривалості не задає. Присутнє, але недостатнє джерело не робить відповідь неоцінюваною (не X). Текст називає саме відсутню інформацію й не вигадує строк, тому за правилом рубрики про виправдану невизначеність призначено Q.
