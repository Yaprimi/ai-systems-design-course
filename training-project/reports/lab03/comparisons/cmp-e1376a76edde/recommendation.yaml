schema_version: '1.0'
comparison_id: cmp-e1376a76edde
outcome: recommend-b
rationale: 'За замороженим протоколом cmp-e1376a76edde блокувальну умову (будь-яка assessable відповідь
  категорії U) порушує конфігурація A: 1 критична U у зрізі distractor; конфігурація B має 0 U. Семантичний
  поріг 3/4 для A не виконано (rubric_acceptable/assessable = 4/6 ≈ 0,67), для B виконано (4/4 = 1,0);
  кількість assessable відповідей не менша за 3 в обох конфігурацій. Операційний поріг виконано: медіана
  затримки 4,24 с для A і 4,47 с для B (по 8 вимірювань, ліміт 30 с). Вимірна перевага B: відсутність
  відповіді U за її наявності в A та вища частка rubric_acceptable серед assessable. Вартість і використання
  токенів невідомі, домінування за цими вимірами не заявляється. Отже, застосовано правило recommend-b.'
limitations:
- small designed set
- одна родина, 4 кейси, 16 спроб, одна критична U у A (n=1)
- структурна чинність B становить 4/8 проти 6/8 в A, тому перевага B стосується лише assessable відповідей,
  а три з чотирьох структурно недійсних відповідей B повернула модель liquid/lfm-2.5-2.6b
- маршрут openrouter/free повертав різні моделі між спробами, тому ефект інструкції не відокремлено від
  складу моделей
- оцінювання виконав один оцінювач-людина, мінливість оцінювача не виміряно
- поле repeated_attempt_differences порожнє й не свідчить про стабільність генерування
- вартість, квота й токени невідомі
- рішення не дозволяє розгортання або запис до прийнятого стану знань
blocking_failures: Критична відмова U, тобто будь-яка assessable відповідь конфігурації з категорією U
  (суттєве твердження, непідтримане наданим джерелом), порушує блокувальну умову цієї конфігурації, навіть
  якщо її частка змістового покриття вища, ніж в іншої конфігурації.
decision_rule:
  recommend-b: Variant B задовольняє кожну блокувальну умову, змістовий і операційний пороги та має вимірну
    перевагу над Variant A згідно з правилом компромісу.
  retain-a: 'Variant A задовольняє блокувальні умови та пороги, а Variant B не виправдовує заміни: вимірної
    переваги немає або B порушує блокувальну умову чи поріг.'
  reject-both: Обидві конфігурації порушують блокувальну умову, тобто кожна має щонайменше одну assessable
    відповідь категорії U.
  seek-more-evidence: Для щонайменше однієї конфігурації assessable відповідей менше 3, або залишається
    невирішена невизначеність, що не дозволяє зіставити конфігурації за визначеними вимірами.
