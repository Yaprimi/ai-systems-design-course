changed_property: правило відповіді лише за наданим джерелом з явним зазначенням, що джерело не визначає запитаний факт
mechanism: 'Variant A не містить правила про межі доказів і про відсутній факт: на кейсі dev-approval-authority-absent він видав впевнене твердження, якого джерело не підтримує. Варіант B додає одне правило, яке прив''язує відповідь до тверджень джерела та вимагає прямо зазначити відсутність запитаного факту. Це може зменшити непідтримані твердження (U) на кейсах із відсутнім фактом і підвищити частку виправданої невизначеності (Q); побічний ризик полягає в надмірній відмові (R) там, де джерело відповідь дозволяє.'
declared_factors:
- правило відповіді лише за наданим джерелом з явним зазначенням, що джерело не визначає запитаний факт
