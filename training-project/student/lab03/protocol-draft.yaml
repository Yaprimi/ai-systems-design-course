engineering_decision: Чи має Variant B замінити Variant A для оцінюваного використання (операція пропозиції концепту, що спирається на модель, на маршруті openrouter/free) за свідченнями спільного офлайн-порівняння на чотирьох held-out кейсах.
hypothesis: Додане правило відповіді лише за наданим джерелом з явним зазначенням відсутнього факту зменшує кількість непідтриманих тверджень (категорія U) на кейсах із відсутнім фактом і не втрачає необхідного змісту (категорія S) на кейсах із достатніми доказами, не виходячи за межі затримки.
semantic_acceptance: 'Частка змістового покриття обчислюється окремо для кожної конфігурації як rubric_acceptable / assessable, де rubric_acceptable означає відповідь, що отримала категорію, очікувану кейсом (S для кейсів із достатніми доказами, Q для кейсів із відсутнім фактом). Поріг: не менше 3/4 (0,75) для кожної конфігурації за умови, що кількість assessable відповідей становить щонайменше 3 з 8 запланованих спроб конфігурації. Якщо assessable менше 3, поріг для цієї конфігурації не вважається ні виконаним, ні порушеним, а свідчень недостатньо.'
blocking_failures: Критична відмова U, тобто будь-яка assessable відповідь конфігурації з категорією U (суттєве твердження, непідтримане наданим джерелом), порушує блокувальну умову цієї конфігурації, навіть якщо її частка змістового покриття вища, ніж в іншої конфігурації.
operational_acceptance: 'Затримка вимірюється для обох конфігурацій на одному інтервалі: від початку спроби (started_at) до повернення відповіді (finished_at). Медіана затримки за спробами з виміряною затримкою має бути не більшою за 30 с для кожної конфігурації (development-спостереження: від 2,7 до 15,3 с). Невідома затримка позначається як невідома, а не нуль, і виключається з обчислення медіани. Невідоме використання токенів, квоти чи вартості не вважається нульовим і не використовується для твердження про домінування. Фактична модель маршруту (observed_model) може змінюватися між спробами; її фіксують як бокове свідчення й наводять в обмеженнях, але вона не є умовою прийняття.'
tradeoff_rule: 'Variant B може замінити прийнятний Variant A лише якщо B задовольняє всі блокувальні умови, змістовий і операційний пороги та має вимірну перевагу: вищу частку rubric_acceptable серед assessable або відсутність відповідей U за наявності їх у A. Домінування над невідомим вимірюваним виміром (вартість, використання токенів) не заявляється. Якщо вимірної переваги немає, Variant A залишається.'
decision_rule:
  recommend-b: Variant B задовольняє кожну блокувальну умову, змістовий і операційний пороги та має вимірну перевагу над Variant A згідно з правилом компромісу.
  retain-a: 'Variant A задовольняє блокувальні умови та пороги, а Variant B не виправдовує заміни: вимірної переваги немає або B порушує блокувальну умову чи поріг.'
  reject-both: Обидві конфігурації порушують блокувальну умову, тобто кожна має щонайменше одну assessable відповідь категорії U.
  seek-more-evidence: Для щонайменше однієї конфігурації assessable відповідей менше 3, або залишається невирішена невизначеність, що не дозволяє зіставити конфігурації за визначеними вимірами.
attempt_budget: 16
timing_boundary: Від початку спроби (started_at) до повернення відповіді (finished_at), однаково для обох конфігурацій.
